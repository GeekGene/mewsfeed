name = "mewsfeed-joining"
main = "worker-entry.ts"
compatibility_date = "2024-12-01"

# KV namespace for session storage and linker URL registrations.
# Both KvSessionStore and KvUrlProvider use this namespace.
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

# Secrets (set via `wrangler secret put`):
#   CONFIG_JSON       — Full service config JSON (see deploy.sh setup)
#   SIGNING_KEY_HEX   — Ed25519 signing key for membrane proofs (optional)

[vars]
# Non-secret config can go here as overrides.
# Full config is in CONFIG_JSON secret.
